<style type="text/css">

body{

#icon-back2{

#icon-next{

#icon-next2{
    position: absolute;

    right: 10%;

    height: 4%;

#icon-uk{

<script type="text/javascript">

var baseUrl = 'http://hallofhistory.mwit.ac.th/admin/public/';
//var baseUrl = 'http://10.0.0.13/PICO/public/';

</head>
<body>
    
    <a href="../index-2.html"><img src="images/back-home.png" id="back-home"></a>

<div class="t">
    <div class="tc rel">
    	<div id="book-box">
            <div class="book" id="book">
            </div>
       </div>
    </div>
</div>

<img src="images/back.png" id="icon-back" onClick="$('#book').turn('previous');" />
<img src="images/back2.png" id="icon-back2" onClick="$('#book').turn('page', 1);" />
<img src="images/th-35.png" id="icon-th" onClick="setLang('TH');" />
<img src="images/libary.png" id="icon-libary" onClick="$('#book').turn('page', 3);" />
<img src="images/uk-35.png" id="icon-uk" onClick="setLang('EN');" />
<img src="images/next.png" id="icon-next" onClick="$('#book').turn('next');" />
<img src="images/next2.png" id="icon-next2" />

<script type="text/javascript">

var lang = "TH";
var pageNow = 0;


function setLang(l){
    lang = l;
    $(".page_success").removeClass("page_success");
    getPageDetail(pageNow);
}

(function () {
    'use strict';
	
	$("#book").bind("turning", function(event, page, pageObject) {
		// Implementation
		getPageDetail(page);
	});
	
	$( window ).resize(function() {
		$(".page").removeClass('page_success');
	});
		
	$.ajax({
		url: baseUrl+'/api/mobileapp/book?callback=results',
		dataType:"jsonp",
		success: function(data){
			var m = data.number_of_pages;
			//console.log(m);
			var html = '';
			for(var i=1;i<=m;i++){
				html += '<div class="page page'+i+'"><img src="images/loading.gif" /></div>';
				if(i == m){
					$("#book").html(html);
					$("#icon-next2").attr('onClick',"$('#book').turn('page', "+i+");");
					getAllPage();
				}
			}
			
		}
	});
	
   
}());


function getPageDetail(page){
	pageNow = page;
	$.ajax({
		url: baseUrl+'api/mobileapp/pages/'+page+'?w='+$("#book").width()+'&h='+$("#book").height()+'&lang='+lang+'&callback=results',
		dataType:"jsonp",
		success: function(data){
			var count = 0;
			if(page == 1){
				var count = 1;
			}else{
				count = page-1;
			}
			  for(var key in data) {
				if (data.hasOwnProperty(key)) {
					if(!$(".page"+data[count].number).hasClass('page_success')){
						//console.log(data[count].number);
						if(data[count].interactions){
							$(".page"+data[count].number).html('<img src="'+data[count].iphone_url+'" />'+data[count].interactions);
						}else{
							$(".page"+data[count].number).html('<img src="'+data[count].iphone_url+'" />');
						}
						$(".page"+data[count].number).addClass('page_success');
						$(".page"+data[count].number).on('click', function (e) {
							//console.log('Page : '+data[count].number);
							console.log(e);
							console.log('X : '+e.offsetX);
							console.log('Y : '+e.offsetY);
						});
					}
				  ++count;
				}
			  }
		}
	});
}

function getAllPage(){	
	 var module = {
        ratio: 0.69 , //1.38,
        init: function (id) {
            var me = this;

            // if older browser then don't run javascript
            if (document.addEventListener) {
                this.el = document.getElementById(id);
                this.resize();
                this.plugins();

                // on window resize, update the plugin size
                window.addEventListener('resize', function (e) {
                    var size = me.resize();
                    $(me.el).turn('size', size.width, size.height);
                });
            }
        },
        resize: function () {
            // reset the width and height to the css defaults
            this.el.style.width = '';
            this.el.style.height = '';

            var width = this.el.clientWidth,
                height = Math.round(width / this.ratio),
                padded = Math.round(document.body.clientHeight * 0.9);

            // if the height is too big for the window, constrain it
            if (height > padded) {
                height = padded;
                width = Math.round(height * this.ratio);
            }

            // set the width and height matching the aspect ratio
            this.el.style.width = width + 'px';
            this.el.style.height = height + 'px';

            return {
                width: width,
                height: height
            };
        },
        plugins: function () {
            // run the plugin
            $(this.el).turn({
                display: "single",
                gradients: true,
                acceleration: true
            });
            // hide the body overflow
            document.body.className = 'hide-overflow';
        }
    };

    module.init('book');	
}

var myScroll;

function loaded() {
   myScroll = new IScroll('#book-box', {
                           zoom: true,
                           scrollX: true,
                           scrollY: true,
                           mouseWheel: true,
                           wheelAction: 'zoom'
                           });
}

$(document).ready(function(){
     loaded();
	 var book_div = $("#book").position();
	 
	 $("#book-box").on("click tap", ".open-page", function(){
	 	openPage($(this).attr('data-open-page-id'));
	 });
});

function openPage(number){
	$("#book").turn("page", number);
}

</script>

</body>
